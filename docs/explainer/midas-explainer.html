/* One deliberate look in every theme: a dark broadcast stage with gold accents. */
:root {
  --bg: #05050a;
  --fg: #f4f1ea;
  --dim: #8b8896;
  --gold: #f2c14e;
  --panel: #0e0e16;
  --line: rgba(255, 255, 255, 0.12);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 16px; font-family: 'Inter Tight', system-ui, sans-serif; overflow-x: hidden;
}
.stage { width: min(100%, calc((100vh - 96px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
canvas { width: 100%; height: 100%; display: block; background: var(--bg); }
.controls { width: min(100%, calc((100vh - 96px) * 16 / 9)); display: flex; align-items: center; gap: 12px; font: 500 13px 'JetBrains Mono', monospace; color: var(--dim); }
.controls button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; min-width: 74px; }
.controls button:hover, .controls button:focus-visible, .chapters button:focus-visible { border-color: var(--gold); outline: 2px solid var(--gold); outline-offset: 2px; }
.controls input[type=range] { flex: 1; accent-color: var(--gold); min-width: 0; }
.controls .time { min-width: 92px; text-align: right; }
.chapters { width: min(100%, calc((100vh - 96px) * 16 / 9)); display: flex; flex-wrap: wrap; gap: 6px; }
.chapters button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font: 500 12px 'JetBrains Mono', monospace; cursor: pointer; }
.chapters button.on { color: var(--bg); background: var(--gold); border-color: var(--gold); }
body.render { padding: 0; display: block; }
body.render .stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
body.render .controls, body.render .chapters { display: none; }
</style>

  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * 0.16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * 0.26, y - s * 0.26); ctx.lineTo(x + s * 0.26, y + s * 0.26);

function arrowHead(x, y, ang, s, color, a = 1) {

}
/** Point along a cubic bezier. */
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [
    u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
    u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
  ];
}
function goldGradient(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#FFE9A8'); g.addColorStop(0.45, '#F2C14E'); g.addColorStop(1, '#C8892A');
  return g;
}

const GRAPH = (() => {
  const r = rng(23);

  const nodes = Array.from({ length: 34 }, (_, i) => ({ x: 170 + r() * 680, y: 345 + r() * 545, k: kinds[i < 1 ? 0 : Math.floor(r() * 4)] }));
  for (let it = 0; it < 80; it++) {

      if (a === b) continue;
      const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1;
      if (d < 120) { a.x += (dx / d) * (120 - d) * 0.05; a.y += (dy / d) * (120 - d) * 0.05; }

    const near = nodes.map((b, j) => [Math.hypot(a.x - b.x, a.y - b.y), j]).filter(([, j]) => j !== i).sort((p, q) => p[0] - q[0]).slice(0, 2);
    for (const [, j] of near) if (!edges.some(([p, q]) => (p === i && q === j) || (p === j && q === i))) edges.push([i, j]);
  });
  // hop distance from the seed node (index 0) for the PageRank ripple
  const hop = nodes.map(() => Infinity); hop[0] = 0;
  for (let k = 0; k < 12; k++) for (const [p, q] of edges) { hop[q] = Math.min(hop[q], hop[p] + 1); hop[p] = Math.min(hop[p], hop[q] + 1); }

  return { nodes, edges, hop, col, labels };

  box(X(0), y0, X(0.1) - X(0), y1 - y0, { r: 0, fill: hexA(C.red, 0.12), alpha: za });

  // axes

  ctx.save(); ctx.translate(x0 - 92, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);

  ctx.restore();
  // markets
  MKTS.forEach((m, i) => {
    const ma = tw(t, 1.2 + m.j * 1.6, 0.3, E.outBack);

// 09 — $500 for 6 months
const SC_COLOR = { bear: C.red, base: C.amber, bull: C.green };
function sRoi(t) {
  const R = window.ROI;
  header(t, '09 — $500 × 6 MONTHS', 'So what could $500 do?', null, C.green);
  txt(`Monte Carlo · ${R.paths.toLocaleString('en-US')} paths per scenario · MIDAS’s own Kelly sizing, caps, fees and kill switch · balanced preset`, 120, 266, { font: F.mono, size: 20, color: C.dim, alpha: tw(t, 0.6, 0.6) });
  const x0 = 200, x1 = 1170, y0 = 330, y1 = 870, lo = 300, hi = 1400;
  const X = d => lerp(x0, x1, d / R.days);
  const Y = v => y1 - ((v - lo) / (hi - lo)) * (y1 - y0);
  const a = tw(t, 0.6, 0.5);
  for (let v = 300; v <= 1300; v += 200) {
    line(x0, Y(v), x1, Y(v), { color: v === 500 ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.07)', lw: v === 500 ? 1.5 : 1, dash: v === 500 ? [6, 6] : null, alpha: a });
    txt(money(v), x0 - 16, Y(v) + 6, { font: F.mono, size: 18, color: v === 500 ? C.fg : C.dim, align: 'right', alpha: a });
  }
  txt('START', x0 + 10, Y(500) - 10, { font: F.mono, size: 15, color: C.dim, ls: 2, alpha: a });
  for (let m = 0; m <= 6; m++) txt(m ? 'M' + m : '0', X((m * R.days) / 6), y1 + 32, { font: F.mono, size: 18, color: C.dim, align: 'center', alpha: a });
  const p = tw(t, 1.1, 5.2, E.inOut3);
  const xClip = lerp(x0, x1, p);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0 - 6, xClip - x0 + 1, y1 - y0 + 12); ctx.clip();
  const order = ['bear', 'base', 'bull'];
  for (const key of order) {
    const s = R.balanced.find(z => z.key === key), c = SC_COLOR[key];
    const band = (qa, qb, alpha) => {
      ctx.beginPath();
      s.days.forEach((d, i) => (i ? ctx.lineTo(X(d), Y(s.bands[i][qa])) : ctx.moveTo(X(d), Y(s.bands[i][qa]))));
      for (let i = s.days.length - 1; i >= 0; i--) ctx.lineTo(X(s.days[i]), Y(s.bands[i][qb]));
      ctx.closePath(); ctx.fillStyle = hexA(c, alpha); ctx.fill();
    };
    band(0, 4, 0.07); band(1, 3, 0.12);
    for (const path of s.samples.filter(q => Math.max(...q) < hi - 60).slice(0, 6)) {
      ctx.beginPath(); path.forEach((v, i) => (i ? ctx.lineTo(X(s.days[i]), Y(v)) : ctx.moveTo(X(s.days[i]), Y(v))));
      ctx.strokeStyle = hexA(c, 0.16); ctx.lineWidth = 1.2; ctx.stroke();
    }
  }
  for (const key of order) {
    const s = R.balanced.find(z => z.key === key), c = SC_COLOR[key];
    ctx.save(); ctx.beginPath(); s.days.forEach((d, i) => (i ? ctx.lineTo(X(d), Y(s.bands[i][2])) : ctx.moveTo(X(d), Y(s.bands[i][2]))));
    ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.shadowColor = c; ctx.shadowBlur = 16; ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  if (p > 0 && p < 1) line(xClip, y0, xClip, y1, { color: 'rgba(255,255,255,0.25)', lw: 1 });
  // end labels, pushed apart so they never overlap
  const ea = tw(t, 6.2, 0.5);
  const labels = order.map(k => { const s = R.balanced.find(z => z.key === k); return { k, s, y: Y(s.p50) }; }).sort((u, v) => u.y - v.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 40);
  labels.forEach(({ k, s, y }) => {
    const c = SC_COLOR[k];
    box(x1 + 14, y - 18, 158, 36, { r: 8, fill: hexA(c, 0.16), stroke: c, lw: 1.5, alpha: ea });
    txt(`${money(s.p50)} ${pct(s.p50, R.bankroll)}`, x1 + 93, y + 7, { font: F.mono, size: 19, weight: 700, color: c, align: 'center', alpha: ea });
  });
  txt('median of each scenario · bands: P10–P90 and P25–P75', x0, y1 + 64, { font: F.mono, size: 17, color: C.dim, alpha: a });

  // scenario cards
  const cx = 1370, cw = 430;
  const names = { bull: 'BULL', base: 'BASE', bear: 'BEAR' };
  ['bull', 'base', 'bear'].forEach((k, i) => {
    const s = R.balanced.find(z => z.key === k), c = SC_COLOR[k];
    const ca = tw(t, 6.6 + i * 0.4, 0.5);
    const y = 318 + i * 128;
    ctx.save(); ctx.translate((1 - ca) * 40, 0);
    card(cx, y, cw, 114, c, ca, { fillA: 0.06, strokeA: 0.5 });
    txt(names[k], cx + 22, y + 36, { font: F.mono, size: 18, weight: 800, color: c, ls: 3, alpha: ca });
    txt(s.label, cx + 92, y + 36, { size: 19, color: C.dim, alpha: ca });
    txt(money(s.p50), cx + 22, y + 84, { font: F.mono, size: 36, weight: 700, alpha: ca });
    txt(`P10–P90 ${money(s.p10)}–${money(s.p90)}`, cx + cw - 22, y + 70, { font: F.mono, size: 17, color: C.dim, align: 'right', alpha: ca });
    txt(k === 'bear' ? 'kill switch caps the bleed' : `loses money in ${Math.round(s.pLoss * 100)}% of paths`, cx + cw - 22, y + 96, { font: F.mono, size: 17, color: k === 'bear' ? C.red : C.dim, align: 'right', alpha: ca });
    ctx.restore();
  });
  // the cost nobody puts in the chart
  const ha = tw(t, 10.4, 0.6);
  if (ha > 0) {
    const bull = R.balanced.find(z => z.key === 'bull'), base = R.balanced.find(z => z.key === 'base');
    ctx.save(); ctx.translate(0, (1 - ha) * 24);
    card(cx, 712, cw, 222, C.gold, ha, { fillA: 0.08, strokeA: 0.7, glow: 16 * ha });
    txt('THE HIDDEN COST', cx + 22, 748, { font: F.mono, size: 18, weight: 800, color: C.gold, ls: 3, alpha: ha });
    rich([['LLM spend capped at ', { color: C.dim }], [`$${R.llmUsdPerDay}/day`, { color: C.fg, weight: 700 }], [' = ', { color: C.dim }], [`−${money(R.llmUsd6mo)}`, { color: C.red, weight: 700 }]], cx + 22, 786, { size: 23, alpha: ha });
    rich([['net median: bull ', { color: C.dim }], [signed(bull.p50 - R.bankroll - R.llmUsd6mo), { color: C.green, weight: 700 }], ['  ·  base ', { color: C.dim }], [signed(base.p50 - R.bankroll - R.llmUsd6mo), { color: C.red, weight: 700 }]], cx + 22, 822, { size: 23, alpha: ha });
    txt('At $500 the API bill — not the market —', cx + 22, 860, { size: 21, weight: 600, alpha: tw(t, 11.2, 0.5) });
    txt('is your biggest risk.', cx + 22, 888, { size: 21, weight: 600, alpha: tw(t, 11.2, 0.5) });
    txt('Why $500? It’s MIDAS’s default live cap.', cx + 22, 918, { size: 20, color: C.dim, alpha: tw(t, 11.8, 0.5) });
    ctx.restore();
  }
  const ag = R.aggressive.find(z => z.key === 'bull'), agBear = R.aggressive.find(z => z.key === 'bear');
  const aa = tw(t, 13.4, 0.6);
  rich([['Aggressive preset, bull case: ', { color: C.dim }], [`median ${money(ag.p50)} (${(ag.p50 / R.bankroll).toFixed(1)}×) · P90 ${money(ag.p90)}`, { color: C.green, weight: 700 }], [` — and a deeper bear (P10 ${money(agBear.p10)})`, { color: C.dim }]], 120, 978, { size: 22, alpha: aa });
  txt('Scenario model, not a track record · real money only after the readiness gate · not financial advice · npx tsx docs/explainer/roi-sim.ts', 120, 1010, { font: F.mono, size: 15, color: C.dim, alpha: tw(t, 14.2, 0.6) });
}

function sOutro(t, dur) {
  const a = tw(t, 0.1, 0.8);
  ctx.save(); ctx.translate(W / 2, 430); ctx.globalAlpha = a; const s = 1.08 - 0.08 * a; ctx.scale(s, s);
  setFont({ size: 210, weight: 900, ls: 28 }); ctx.textAlign = 'center'; ctx.shadowColor = hexA(C.gold, 0.5); ctx.shadowBlur = 50;
  ctx.fillStyle = goldGradient(-420, -170, 420, 30); ctx.fillText('MIDAS', 14, 0); ctx.restore();
  [['Paper by default.', C.fg], ['Live behind a triple gate.', C.fg], ['Only ground truth teaches.', C.gold2]].forEach(([s2, c], i) => {

    txt(s2, W / 2, 570 + i * 70 + (1 - la) * 20, { size: i === 2 ? 58 : 48, weight: i === 2 ? 400 : 600, font: i === 2 ? F.serif : F.sans, italic: i === 2, color: c, align: 'center', alpha: la });
  });
  txt('github.com/waltergropius/midas', W / 2, 860, { font: F.mono, size: 32, weight: 600, color: C.fg, align: 'center', alpha: tw(t, 2.5, 0.6) });
  txt('VERCEL · MODAL · SPACETIMEDB · GEMINI · JEV / LAYA', W / 2, 912, { font: F.mono, size: 20, color: C.dim, ls: 5, align: 'center', alpha: tw(t, 2.9, 0.6) });
  const fade = tw(t, dur - 0.9, 0.9, E.inOut3);

}

// ════════════════════════════════════════════════════════════════════════
// Timeline
// ════════════════════════════════════════════════════════════════════════
const SCENES = [
  { name: 'Hook', dur: 15, draw: sHook, glow: C.gold, chrome: false },
  { name: 'The loop', dur: 10, draw: sLoop, glow: C.gold },
  { name: 'System 1', dur: 10.5, draw: sSys1, glow: C.cyan },
  { name: 'System 2', dur: 14, draw: sSys2, glow: C.violet },
  { name: 'Decision plane', dur: 16, draw: sDecide, glow: C.gold },
  { name: 'Learning', dur: 11, draw: sLearn, glow: C.green },
  { name: 'Infrastructure', dur: 9.5, draw: sInfra, glow: C.gold },
  { name: 'Why different', dur: 11, draw: sDiff, glow: C.gold },
  { name: 'Ideal markets', dur: 11.5, draw: sMarkets, glow: C.gold },
  { name: '$500 × 6 months', dur: 19.5, draw: sRoi, glow: C.green },
  { name: 'Outro', dur: 7, draw: sOutro, glow: C.gold, chrome: false, noFadeOut: true },
];
let acc = 0;
for (const s of SCENES) { s.start = acc; acc += s.dur; }
const TOTAL = acc;
const CHAPTERED = SCENES.filter(s => s.chrome !== false);

const DOTS = (() => { const out = []; for (let y = 0; y < H + 48; y += 48) for (let x = 0; x < W + 48; x += 48) out.push([x, y]); return out; })();
function background(T, glows) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  for (const [color, a] of glows) {
    if (a <= 0) continue;
    const g = ctx.createRadialGradient(W * 0.72, H * 0.3, 0, W * 0.72, H * 0.3, 1150);
    g.addColorStop(0, hexA(color, 0.11 * a)); g.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const off = (T * 8) % 48;
  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  for (const [x, y] of DOTS) ctx.fillRect(x - off, y - off * 0.5, 2, 2);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function chrome(T, scene) {
  if (scene.chrome === false) return;
  const idx = CHAPTERED.indexOf(scene);
  const a0 = CHAPTERED[0].start, a1 = CHAPTERED[CHAPTERED.length - 1].start + CHAPTERED[CHAPTERED.length - 1].dur;
  const fadeIn = clamp01((T - a0) / 0.6), fadeOut = 1 - clamp01((T - (a1 - 0.5)) / 0.5);
  const a = fadeIn * fadeOut;
  rich([['◆ MIDAS', { color: C.gold, weight: 700 }], ['   ' + scene.name.toUpperCase(), { color: C.dim }]], 120, 1046, { font: F.mono, size: 16, ls: 3, alpha: a });
  txt(`${String(idx + 1).padStart(2, '0')} / ${String(CHAPTERED.length).padStart(2, '0')}`, 1800, 1046, { font: F.mono, size: 16, color: C.dim, align: 'right', ls: 3, alpha: a });
  const p = clamp01((T - a0) / (a1 - a0));
  box(120, 1060, 1680, 3, { r: 2, fill: 'rgba(255,255,255,0.08)', alpha: a });
  box(120, 1060, 1680 * p, 3, { r: 2, fill: C.gold, alpha: a });
}
function render(T) {
  T = Math.max(0, Math.min(TOTAL - 1e-6, T));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  const active = [];
  for (const s of SCENES) {
    const t = T - s.start;
    if (t < -0.01 || t > s.dur + 0.01) continue;
    const fin = s.start === 0 ? clamp01(t / 0.5) : tw(t, 0, 0.45, E.out3);
    const fout = s.noFadeOut ? 1 : 1 - tw(t, s.dur - 0.45, 0.45, E.inOut3);
    active.push({ s, t, a: fin * fout });
  }
  background(T, active.map(x => [x.s.glow, x.a]));
  for (const { s, t, a } of active) {
    if (a <= 0.001) continue;
    ctx.save();
    ctx.globalAlpha = a;
    s.draw(t, s.dur);
    ctx.restore();
  }
  if (active.length) chrome(T, active[active.length - 1].s);
}

// ── playback
const params = new URLSearchParams(location.search);
const renderMode = params.has('render');
if (renderMode) document.body.classList.add('render');
const ready = document.fonts.ready.then(() =>
  Promise.all([
    document.fonts.load('800 40px "Inter Tight"'), document.fonts.load('400 40px "Inter Tight"'),
    document.fonts.load('700 40px "JetBrains Mono"'), document.fonts.load('italic 400 40px "Instrument Serif"'),
  ])
);
window.__total = TOTAL;
window.__ready = ready;
window.__frame = T => { render(T); };

if (!renderMode) {
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const chapters = document.getElementById('chapters');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  // reduced motion: open paused on the hook's payoff frame and let the viewer press play
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !calm, T = Number(params.get('t')) || (calm ? 6.6 : 0), last = null;
  if (calm) playBtn.textContent = 'Play';
  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = s.name; b.onclick = () => { T = s.start + 0.01; draw(); };
    chapters.appendChild(b); s.btn = b;
  });
  const draw = () => {
    render(T);
    scrub.value = String(Math.round((T / TOTAL) * 1000));
    time.textContent = `${fmt(T)} / ${fmt(TOTAL)}`;
    for (const s of SCENES) s.btn.classList.toggle('on', T >= s.start && T < s.start + s.dur);
  };
  const tick = now => {
    if (playing && last !== null) { T += (now - last) / 1000; if (T >= TOTAL) T = 0; }
    last = now;
    draw();
    requestAnimationFrame(tick);
  };
  const toggle = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };
  playBtn.onclick = toggle;
  scrub.oninput = () => { T = (Number(scrub.value) / 1000) * TOTAL; draw(); };
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') T = Math.min(TOTAL - 0.01, T + 5);
    else if (e.key === 'ArrowLeft') T = Math.max(0, T - 5);
    else if (/^[0-9]$/.test(e.key) && SCENES[Number(e.key)]) T = SCENES[Number(e.key)].start + 0.01;
  });
  ready.then(() => requestAnimationFrame(tick));
}
